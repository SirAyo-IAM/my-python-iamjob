name: Run UK IAM Hunter V5

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * *"
      timezone: "Europe/London"

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. CHECKOUT REPOSITORY
      # ---------------------------------------------------------
      - name: Get repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. SET UP PYTHON
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------------
      # 3. VERIFY REPOSITORY FILES + CONFIRM V5
      # ---------------------------------------------------------
      - name: Verify repository files
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository contents:"
          ls -la

          test -f uk_iam_hunter.py || {
            echo "ERROR: uk_iam_hunter.py was not found in the repository root."
            exit 1
          }

          test -f send_email.py || {
            echo "ERROR: send_email.py was not found in the repository root."
            exit 1
          }

          echo ""
          echo "Checking that uk_iam_hunter.py is V5..."

          if ! grep -q "UK IAM / PAM JOB DISCOVERY ENGINE v5" uk_iam_hunter.py; then
            echo "ERROR: uk_iam_hunter.py exists, but it is not the V5 engine."
            echo ""
            echo "Detected version references:"
            grep -niE "JOB DISCOVERY ENGINE v[0-9]+|JOB HUNTER v[0-9]+" uk_iam_hunter.py | head -20 || true
            exit 1
          fi

          echo "V5 engine confirmed."
          echo "Required repository files found."

      # ---------------------------------------------------------
      # 4. INSTALL PYTHON DEPENDENCIES
      # ---------------------------------------------------------
      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install             requests             beautifulsoup4             lxml             rich             playwright

      # ---------------------------------------------------------
      # 5. INSTALL PLAYWRIGHT CHROMIUM
      # ---------------------------------------------------------
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m playwright install --with-deps chromium

      # ---------------------------------------------------------
      # 6. VERIFY PYTHON ENVIRONMENT
      # ---------------------------------------------------------
      - name: Verify Python environment
        shell: bash
        run: |
          set -euo pipefail

          python --version
          python -m pip --version

          python - <<'PY'
          import requests
          import bs4
          import lxml
          import rich
          import playwright

          print("requests: OK")
          print("beautifulsoup4: OK")
          print("lxml: OK")
          print("rich: OK")
          print("playwright: OK")
          PY

          python -m playwright --version

          echo ""
          echo "Checking Python syntax..."
          python -m py_compile uk_iam_hunter.py
          python -m py_compile send_email.py
          echo "Python syntax: OK"

      # ---------------------------------------------------------
      # 7. RUN V5 SELF-TEST
      # ---------------------------------------------------------
      - name: Run V5 regression tests
        shell: bash
        run: |
          set -euo pipefail

          echo "Running V5 self-test..."
          python uk_iam_hunter.py --self-test

      # ---------------------------------------------------------
      # 8. RUN IAM JOB DISCOVERY ENGINE V5
      # ---------------------------------------------------------
      - name: Run UK IAM Hunter V5
        env:
          USE_PLAYWRIGHT: "true"
          IAM_MIN_SCORE: "75"
          ARCHIVE_TO_GOOGLE: "true"
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          GOOGLE_APPS_SCRIPT_TOKEN: ${{ secrets.GOOGLE_APPS_SCRIPT_TOKEN }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting V5 live scan..."
          python uk_iam_hunter.py

      # ---------------------------------------------------------
      # 9. VERIFY GENERATED OUTPUT FILES
      # ---------------------------------------------------------
      - name: Check results
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking generated files..."

          test -f uk_iam_results.csv || {
            echo "ERROR: uk_iam_results.csv was not created"
            exit 1
          }

          test -f uk_iam_results.json || {
            echo "ERROR: uk_iam_results.json was not created"
            exit 1
          }

          test -f uk_iam_source_audit.csv || {
            echo "ERROR: uk_iam_source_audit.csv was not created"
            exit 1
          }

          test -f uk_iam_run_log.csv || {
            echo "ERROR: uk_iam_run_log.csv was not created"
            exit 1
          }

          echo ""
          echo "Generated files:"
          ls -lh             uk_iam_results.csv             uk_iam_results.json             uk_iam_source_audit.csv             uk_iam_run_log.csv

          echo ""
          echo "Number of result CSV lines:"
          wc -l uk_iam_results.csv

      # ---------------------------------------------------------
      # 10. UPLOAD RESULTS
      # ---------------------------------------------------------
      - name: Upload job results
        uses: actions/upload-artifact@v4
        with:
          name: uk-iam-results-v5
          path: |
            uk_iam_results.csv
            uk_iam_results.json
            uk_iam_source_audit.csv
            uk_iam_run_log.csv
          if-no-files-found: error
          retention-days: 14

      # ---------------------------------------------------------
      # 11. SEND EMAIL REPORT
      # ---------------------------------------------------------
      - name: Send email
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail
          python send_email.py
