name: Run UK IAM Hunter

on:
  workflow_dispatch:

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 rich

      - name: Run UK IAM Hunter
        run: python uk_iam_hunter.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: uk-iam-results
          path: uk_iam_results.csv
