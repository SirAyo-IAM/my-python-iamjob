name: Run UK IAM Hunter V5

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * *"
      timezone: "Europe/London"

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. CHECKOUT REPOSITORY
      # ---------------------------------------------------------
      - name: Get repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. SET UP PYTHON
      # No pip cache: avoids requirements.txt/pyproject.toml error.
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------------
      # 3. VERIFY REQUIRED REPOSITORY FILES EXIST
      # ---------------------------------------------------------
      - name: Verify repository files
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository contents:"
          ls -la

          test -f uk_iam_hunter_v5.py || {
            echo "ERROR: uk_iam_hunter_v5.py was not found in the repository root."
            exit 1
          }

          test -f send_email.py || {
            echo "ERROR: send_email.py was not found in the repository root."
            exit 1
          }

          echo "Checking hunter version..."
          grep -q "UK IAM / PAM JOB DISCOVERY ENGINE v5" uk_iam_hunter_v5.py || {
            echo "ERROR: uk_iam_hunter_v5.py is not the V5 engine."
            echo "Detected banner lines:"
            grep -n "DISCOVERY ENGINE v" uk_iam_hunter_v5.py || true
            exit 1
          }

          echo "Required files found and V5 engine confirmed."

      # ---------------------------------------------------------
      # 4. INSTALL REQUIRED PYTHON LIBRARIES
      # ---------------------------------------------------------
      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install \
            requests \
            beautifulsoup4 \
            lxml \
            rich \
            playwright

      # ---------------------------------------------------------
      # 5. INSTALL PLAYWRIGHT CHROMIUM + SYSTEM DEPENDENCIES
      # ---------------------------------------------------------
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m playwright install --with-deps chromium

      # ---------------------------------------------------------
      # 6. VERIFY PYTHON ENVIRONMENT + COMPILE SCRIPTS
      # ---------------------------------------------------------
      - name: Verify Python environment
        shell: bash
        run: |
          set -euo pipefail

          python --version
          python -m pip --version

          python - <<'PY'
          import requests
          import bs4
          import lxml
          import rich
          import playwright

          print("requests: OK")
          print("beautifulsoup4: OK")
          print("lxml: OK")
          print("rich: OK")
          print("playwright: OK")
          PY

          python -m playwright --version

          echo "Checking Python syntax..."
          python -m py_compile uk_iam_hunter_v5.py
          python -m py_compile send_email.py
          echo "Python syntax: OK"

      # ---------------------------------------------------------
      # 7. RUN V5 OFFLINE REGRESSION TESTS
      # ---------------------------------------------------------
      - name: Test V5 matching logic
        shell: bash
        run: |
          set -euo pipefail
          python uk_iam_hunter_v5.py --self-test

      # ---------------------------------------------------------
      # 8. RUN IAM JOB DISCOVERY ENGINE V5
      # ---------------------------------------------------------
      - name: Run UK IAM Hunter V5
        env:
          USE_PLAYWRIGHT: "true"
          USE_GLOBAL_DISCOVERY: "true"
          IAM_MIN_SCORE: "75"
          GLOBAL_SEARCH_QUERY_LIMIT: "18"
          MAX_GLOBAL_CANDIDATES: "320"
          # Optional. Leave the GitHub secret unset if you do not use Brave Search API.
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          ARCHIVE_TO_GOOGLE: "true"
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          GOOGLE_APPS_SCRIPT_TOKEN: ${{ secrets.GOOGLE_APPS_SCRIPT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python uk_iam_hunter_v5.py

      # ---------------------------------------------------------
      # 9. VERIFY OUTPUT FILES
      # ---------------------------------------------------------
      - name: Check results
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking generated files..."

          test -f uk_iam_results.csv || {
            echo "ERROR: uk_iam_results.csv was not created"
            exit 1
          }

          test -f uk_iam_results.json || {
            echo "ERROR: uk_iam_results.json was not created"
            exit 1
          }

          test -f uk_iam_source_audit.csv || {
            echo "ERROR: uk_iam_source_audit.csv was not created"
            exit 1
          }

          test -f uk_iam_run_log.csv || {
            echo "ERROR: uk_iam_run_log.csv was not created"
            exit 1
          }

          echo ""
          echo "Generated files:"
          ls -lh \
            uk_iam_results.csv \
            uk_iam_results.json \
            uk_iam_source_audit.csv \
            uk_iam_run_log.csv

          echo ""
          echo "Number of result CSV lines:"
          wc -l uk_iam_results.csv

      # ---------------------------------------------------------
      # 10. UPLOAD RESULTS
      # ---------------------------------------------------------
      - name: Upload job results
        uses: actions/upload-artifact@v4
        with:
          name: uk-iam-results
          path: |
            uk_iam_results.csv
            uk_iam_results.json
            uk_iam_source_audit.csv
            uk_iam_run_log.csv
          if-no-files-found: error
          retention-days: 14

      # ---------------------------------------------------------
      # 11. SEND EMAIL REPORT
      # ---------------------------------------------------------
      - name: Send email
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail
          python send_email.py
