name: Run UK IAM Hunter V5.4

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "uk_iam_hunter.py"
      - "iam_priority_discovery.py"
      - "send_email.py"
      - ".github/workflows/main.yml"

  schedule:
    - cron: "0 12 * * *"
      timezone: "Europe/London"

concurrency:
  group: uk-iam-hunter-main
  cancel-in-progress: true

jobs:
  run-python:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify repository files
        shell: bash
        run: |
          set -euo pipefail

          test -f uk_iam_hunter.py || {
            echo "ERROR: uk_iam_hunter.py was not found."
            exit 1
          }

          test -f iam_priority_discovery.py || {
            echo "ERROR: iam_priority_discovery.py was not found."
            exit 1
          }

          test -f send_email.py || {
            echo "ERROR: send_email.py was not found."
            exit 1
          }

          if ! grep -q "UK IAM / PAM JOB DISCOVERY ENGINE v5.4" uk_iam_hunter.py; then
            echo "ERROR: uk_iam_hunter.py is not V5.4."
            grep -niE "JOB DISCOVERY ENGINE v[0-9]+(\.[0-9]+)?" uk_iam_hunter.py | head -20 || true
            exit 1
          fi

          echo "V5.4 engine confirmed."

      - name: Restore seen-job state
        id: iam-state-restore
        uses: actions/cache/restore@v4
        with:
          path: .iam_state
          key: iam-seen-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            iam-seen-${{ runner.os }}-

      - name: Prepare state directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .iam_state

          if [ -f .iam_state/seen_jobs.json ]; then
            echo "Previous seen-job state restored."
            python - <<'PY'
          import json

          with open(".iam_state/seen_jobs.json", encoding="utf-8") as handle:
              state = json.load(handle)

          print(
              "Remembered jobs:",
              len(state.get("jobs", {})),
          )
          PY
          else
            echo "No previous state found."
            echo "This is a baseline run: current matches will be treated as NEW once."
          fi

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml rich

      - name: Verify Python environment
        shell: bash
        run: |
          set -euo pipefail

          python --version
          python -m py_compile uk_iam_hunter.py
          python -m py_compile iam_priority_discovery.py
          python -m py_compile send_email.py

          python - <<'PY'
          import requests
          import bs4
          import lxml
          import rich
          print("Python dependencies: OK")
          PY

      - name: Run V5.4 regression tests
        shell: bash
        run: |
          set -euo pipefail
          python uk_iam_hunter.py --self-test
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from send_email import deduplicate_email_jobs, email_worthy
          # User-reported missed official vacancies must remain discovery seeds.
          # These are candidate inputs, not automatic emails: the live UK,
          # permanent, original-date and relevance filters still apply.
          from iam_priority_discovery import DIRECT_JOB_SEEDS, PRIORITY_OFFICIAL_QUERIES, recover_tesco_employment_type
          for fragment in (
              "/JobDetail/218148",
              "/ebury/jobs/4922605101",
              "/jobs/t-R0052359",
              "/Senior-IDM_JR1001116",
          ):
              assert any(fragment in url for url in DIRECT_JOB_SEEDS), fragment
          for domain in ("careers.tesco.com", "greenhouse.io/ebury",
                         "careers.sky.com", "cloudpay.wd3.myworkdayjobs.com"):
              assert any(domain in query for query in PRIORITY_OFFICIAL_QUERIES), domain
          print("PASS | Tesco, Ebury, Sky and CloudPay official-source regression seeds")
          # Tesco can publish employmentType=[''] in JSON-LD even when the
          # official job description explicitly states Edinburgh, Permanent.
          tesco = {
              "url": "https://careers.tesco.com/en_GB/careers/JobDetail/218148",
              "employment_type": "['']",
              "description_excerpt": "Location – Edinburgh, Permanent Office Attendance – Hybrid",
          }
          assert recover_tesco_employment_type(tesco)["employment_type"] == "Permanent"
          assert recover_tesco_employment_type({**tesco, "description_excerpt": "Location – Edinburgh, Contract"})["employment_type"] == "['']"
          assert recover_tesco_employment_type({**tesco, "url": "https://example.com/jobs/123"})["employment_type"] == "['']"
          assert recover_tesco_employment_type({**tesco, "employment_type": "Fixed-term"})["employment_type"] == "Fixed-term"
          print("PASS | Tesco explicit permanent evidence recovery; no full-time inference")
          base = {
              "company": "Netcompany",
              "title": "IAM Service Operations Engineer",
              "location": "Leeds, United Kingdom",
              "date_posted": datetime.now(timezone.utc).isoformat(),
              "url": "https://jobs.smartrecruiters.com/Netcompany1/123",
              "employment_type": "Permanent",
              "description_verified": "YES",
              "description_length": "420",
              "location_status": "UK CONFIRMED",
              "match_type": "CORE IAM",
              "match_score": "105",
              "source_method": "SmartRecruiters Public API",
          }
          london = {**base, "location": "London, United Kingdom",
                    "url": "https://jobs.smartrecruiters.com/Netcompany1/456"}
          # Separate requisitions must not be collapsed just because title/date match.
          assert len(deduplicate_email_jobs([base, london])) == 2
          # Tracking variants and the same employer requisition must be deduplicated.
          same_job = {**base, "location": "London, United Kingdom",
                      "url": base["url"] + "?utm_source=linkedin"}
          assert len(deduplicate_email_jobs([base, same_job])) == 1
          assert deduplicate_email_jobs([base, same_job])[0]["location"].startswith("London")
          same_ref = {**london, "job_reference": "REQ-123"}
          first_ref = {**base, "job_reference": "REQ-123"}
          assert len(deduplicate_email_jobs([first_ref, same_ref])) == 1
          from uk_iam_hunter import canonical_url
          a1 = canonical_url("https://www.ansonmccade.com/vacancy_detail.php?vacancy_id=104247")
          a2 = canonical_url("https://www.ansonmccade.com/vacancy_detail.php?vacancy_id=104067")
          assert a1 != a2 and "vacancy_id=104247" in a1
          assert not email_worthy({**base, "company": ""})
          assert not email_worthy({**base, "employment_type": "Contract"})
          assert email_worthy(london)
          assert not email_worthy({**base, "employment_type": "Full-time"})
          assert not email_worthy({**base, "description_verified": "NO"})
          assert not email_worthy({**base, "description_verified": ""})
          assert not email_worthy({**base, "location_status": "UK UNKNOWN"})
          assert not email_worthy({**base, "match_score": "20"})
          assert not email_worthy({**base, "source_method": ""})
          stale = {**base, "date_posted": (datetime.now(timezone.utc) - timedelta(days=10)).isoformat()}
          assert not email_worthy(stale)
          assert not email_worthy({**base, "date_posted": ""})
          assert not email_worthy({**base, "date_posted": "unverified"})
          # A worldwide remote-jobs aggregator produced a false-positive CyberArk alert.
          # Reject its original URL even when the extracted title/location look UK IAM.
          aggregator = {**base, "company": "United States Digital Experience Platforms",
                        "title": "CyberArk Architect", "location": "London",
                        "url": "https://www.remoteanywherejob.com/en/job/example",
                        "date_posted": "", "employment_type": ""}
          assert not email_worthy(aggregator)
          from uk_iam_hunter import is_blocked_job_board, looks_like_official_job_candidate
          assert is_blocked_job_board(aggregator["url"])
          assert not looks_like_official_job_candidate(aggregator["url"])
          assert not is_blocked_job_board(base["url"])
          from unittest.mock import patch
          from send_email import live_application_page
          class Page:
              status_code = 200
              url = base["url"]
              text = ("<h1>IAM Service Operations Engineer</h1>"
                      "<p>Identity and access management responsibilities include "
                      "identity lifecycle provisioning, SailPoint governance, "
                      "Microsoft Entra ID authentication, incident resolution and "
                      "access reviews. Required experience with IAM operations, "
                      "stakeholder collaboration and identity controls.</p>"
                      "<a href='/apply'>Apply now</a>")
          with patch("send_email.requests.get", return_value=Page()):
              assert live_application_page(base)
          class ClosedPage(Page):
              text = "This job is no longer available. " + Page.text
          with patch("send_email.requests.get", return_value=ClosedPage()):
              assert not live_application_page(base)
          class MissingPage(Page):
              status_code = 404
          with patch("send_email.requests.get", return_value=MissingPage()):
              assert not live_application_page(base)
          # Do not advertise vacancies whose explicit application deadline has elapsed.
          from datetime import date
          from send_email import application_deadline_has_passed
          today = date(2026, 10, 27)
          assert application_deadline_has_passed("Closing date: 19 October 2026", today)
          assert application_deadline_has_passed("End Date: October 16, 2026", today)
          assert application_deadline_has_passed("Closing date for applications: Tuesday 29th September 2026", today)
          assert application_deadline_has_passed("Applications close 2026-10-26", today)
          assert not application_deadline_has_passed("Closing date: 27 November 2026", today)
          assert not application_deadline_has_passed("Closing date: 19 October 2026. Revised end date: 27 November 2026", today)
          assert not application_deadline_has_passed("Posted 12 October 2026", today)
          assert not application_deadline_has_passed("Closing date: 29 September", today)
          print("PASS | explicit application deadline freshness guard")
          from send_email import email_rejection_reasons
          assert email_rejection_reasons(base) == []
          assert "permanent employment not evidenced" in email_rejection_reasons({**base, "employment_type": "Full-time"})
          assert "non-permanent employment" in email_rejection_reasons({**base, "employment_type": "Contract"})
          assert "original posting date missing" in email_rejection_reasons({**base, "date_posted": ""})
          assert "substantive job description not verified" in email_rejection_reasons({**base, "description_verified": "NO"})
          assert "UK job location not confirmed" in email_rejection_reasons({**base, "location_status": "UK UNKNOWN"})
          assert email_worthy(base) == (not email_rejection_reasons(base))
          print("PASS | per-vacancy withholding reasons preserve fail-closed email rules")
          print("PASS | description, permanent UK IAM eligibility, live application and closure guards")
          PY

      - name: Run UK IAM Hunter V5.4
        env:
          IAM_MIN_SCORE: "75"
          IAM_MAX_WORKERS: "8"
          IAM_REQUEST_TIMEOUT: "12"
          IAM_SEARCH_TIMEOUT: "8"
          IAM_JOB_TIMEOUT: "12"
          IAM_MAX_PAGES_PER_COMPANY: "6"
          IAM_MAX_JOB_LINKS_PER_COMPANY: "40"
          IAM_MAX_SITEMAP_URLS: "500"
          IAM_COMPANY_SCAN_SECONDS: "75"
          USE_GLOBAL_DISCOVERY: "true"
          USE_SEARCH_DISCOVERY: "true"
          GLOBAL_SEARCH_QUERY_LIMIT: "26"
          MAX_GLOBAL_CANDIDATES: "180"
          MAX_LISTING_LINKS: "80"
          IAM_RECENT_SEARCH_HINT: "posted this week"
          BRAVE_SEARCH_API_KEY: "" # Pause paid Brave requests; retain free search/official discovery
          BRAVE_SEARCH_FRESHNESS: "pw"
          USE_COMPANY_SEARCH_DISCOVERY: "false"
          SEARCH_ENGINE_MODE: "light"
          USE_PLAYWRIGHT: "false"
          IAM_PLAYWRIGHT_BUDGET: "10"
          IAM_STATE_DIR: ".iam_state"
          IAM_STATE_RETENTION_DAYS: "180"
          IAM_NOTIFY_UPDATED_JOBS: "false"
          ARCHIVE_TO_GOOGLE: "false"

        shell: bash
        run: |
          set -euo pipefail
          python uk_iam_hunter.py

      - name: Run priority official IAM discovery
        env:
          IAM_MIN_SCORE: "75"
          IAM_SEARCH_TIMEOUT: "8"
          IAM_JOB_TIMEOUT: "12"
          IAM_MAX_SEARCH_RESULTS: "12"
          IAM_RECENT_SEARCH_HINT: "posted this week"
          SEARCH_ENGINE_MODE: "light"
          BRAVE_SEARCH_API_KEY: "" # Pause paid Brave requests; retain free search/official discovery
          BRAVE_SEARCH_FRESHNESS: "pw"
          IAM_STATE_DIR: ".iam_state"
          IAM_STATE_RETENTION_DAYS: "180"
          IAM_NOTIFY_UPDATED_JOBS: "false"
          USE_PLAYWRIGHT: "false"
          ARCHIVE_TO_GOOGLE: "false"
        shell: bash
        run: |
          set -euo pipefail
          python iam_priority_discovery.py

      - name: Check V5.4 results
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            uk_iam_results.csv \
            uk_iam_new_results.csv \
            uk_iam_results.json \
            uk_iam_new_results.json \
            uk_iam_source_audit.csv \
            uk_iam_run_log.csv \
            .iam_state/seen_jobs.json
          do
            test -f "$file" || {
              echo "ERROR: $file was not created"
              exit 1
            }
          done

          python - <<'PY'
          import csv
          import json

          with open("uk_iam_results.csv", encoding="utf-8-sig", newline="") as handle:
              all_rows = list(csv.DictReader(handle))

          with open("uk_iam_new_results.csv", encoding="utf-8-sig", newline="") as handle:
              new_rows = list(csv.DictReader(handle))

          valid_status = {"NEW", "UPDATED"}
          bad = [
              row.get("notification_status", "")
              for row in new_rows
              if row.get("notification_status", "") not in valid_status
          ]
          if bad:
              raise SystemExit(
                  "ERROR: new-results file contains non-notification rows: "
                  + repr(bad[:5])
              )

          with open(".iam_state/seen_jobs.json", encoding="utf-8") as handle:
              state = json.load(handle)

          print("Current matching jobs:", len(all_rows))
          print("NEW/UPDATED jobs:", len(new_rows))
          print("Remembered jobs:", len(state.get("jobs", {})))
          PY

      - name: Save seen-job state
        if: github.event_name != 'push'
        uses: actions/cache/save@v4
        with:
          path: .iam_state
          key: iam-seen-${{ runner.os }}-${{ github.run_id }}

      - name: Upload job results
        uses: actions/upload-artifact@v4
        with:
          name: uk-iam-results-v5-4
          path: |
            uk_iam_results.csv
            uk_iam_new_results.csv
            uk_iam_results.json
            uk_iam_new_results.json
            uk_iam_source_audit.csv
            uk_iam_run_log.csv
            .iam_state/seen_jobs.json
          if-no-files-found: error
          retention-days: 14

      - name: Send NEW jobs email
        if: github.event_name != 'push'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          IAM_EMAIL_RESULTS_FILE: "uk_iam_new_results.csv"
        shell: bash
        run: |
          set -euo pipefail
          python send_email.py
