name: Run UK IAM Hunter

on:
  workflow_dispatch:

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 rich

      - name: Run UK IAM Hunter
        run: python uk_iam_hunter.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: uk-iam-results
          path: uk_iam_results.csv

      - name: Email results
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
        run: |
          python - <<'PY'
          import os
          import base64
          import requests

          csv_file = "uk_iam_results.csv"

          with open(csv_file, "rb") as f:
              csv_content = base64.b64encode(f.read()).decode("utf-8")

          payload = {
              "sender": {
                  "name": "UK IAM Hunter",
                  "email": os.environ["REPORT_EMAIL"]
              },
              "to": [
                  {
                      "email": os.environ["REPORT_EMAIL"]
                  }
              ],
              "subject": "UK IAM Hunter - Daily Results",
              "textContent": """Your daily UK IAM/PAM job scan is complete.

The CSV containing today's verified job openings is attached.

Regards,
UK IAM Hunter
""",
              "attachment": [
                  {
                      "content": csv_content,
                      "name": "uk_iam_results.csv"
                  }
              ]
          }

          response = requests.post(
              "https://api.brevo.com/v3/smtp/email",
              headers={
                  "accept": "application/json",
                  "api-key": os.environ["BREVO_API_KEY"],
                  "content-type": "application/json"
              },
              json=payload,
              timeout=30
          )

          if response.status_code not in (200, 201):
              print("Brevo response:", response.text)
              raise SystemExit("Email sending failed")

          print("Email sent successfully.")
          print(response.text)
          PY
